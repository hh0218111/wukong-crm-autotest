name: UI Smoke CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: 冒烟集（框架自检，不依赖业务环境）
        # 拦截真实网络请求的假站点自检 + 框架自检，CI 里永远能跑绿
        run: pytest -m "smoke and not skip_env" --alluredir=reports/allure-results
      - name: 留存报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: reports/allure-results
