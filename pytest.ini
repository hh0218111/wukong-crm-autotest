[pytest]
testpaths = tests
# 默认跳过需要真实CRM环境的用例：没起环境时 `pytest` 应该是一片绿，
# 而不是一堆 ECONNREFUSED 让人分不清是框架坏了还是环境没起。
# 要跑真实环境用例：pytest -m skip_env（先确认 .env 里地址账号已配好）
addopts = -v --strict-markers -m "not skip_env" --alluredir=reports/allure-results
markers =
    smoke: 冒烟用例（每次提交必跑）
    ui: UI自动化用例
    api: 接口自动化用例
    selfcheck: 不依赖业务环境的框架自检
    skip_env: 需要真实CRM环境才能跑的用例
